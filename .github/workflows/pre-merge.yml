name: pre-merge

on:
  workflow_dispatch:
    inputs:
      local_ci_passed:
        description: "local CI passed for the final commit"
        required: true
        type: string

permissions:
  contents: read

jobs:
  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: verify local CI flag
        run: test "${{ inputs.local_ci_passed }}" = true
      - name: run product CI
        run: bash scripts/ci_local.sh
